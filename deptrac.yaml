# Deptrac — architecture layers (blocking: `composer deptrac` fails on a violation; CI runs it).
# Layers follow the current structure of themes/wp-fasty/classes and the builder/types plugins.
deptrac:
  cache_file: var/cache/.deptrac.cache
  paths:
    - ./themes/wp-fasty/classes
    - ./themes/wp-fasty
    - ./plugins/wpfasty-builder/src
    - ./modules/builder-agent/src
    - ./plugins/wpfasty-types/src
    - ./vendor/php-stubs/wordpress-stubs
  exclude_files:
    - '#/vendor/#'
    - '#/ui8kit/#'
    - '#/kit/#'
    - '#/twig/#'
    - '#/views/#'
  layers:
    # Domain/Core: container, application kernel, ports (interfaces) and plain DTOs, content-type definitions.
    # Knows nothing of WordPress or the renderer.
    - name: Core
      collectors:
        - { type: classLike, value: '^WPFasty\\Core\\.*' }
        - { type: classLike, value: '^WPFasty\\Types\\(Field|PostType)$' }
    # ViewModel: Core data -> plain template context arrays (builders per domain). No WordPress classes here;
    # no WordPress function calls either (Deptrac does not see global functions: tests/ArchitectureTest.php).
    - name: ViewModel
      collectors:
        - type: bool
          must:
            - { type: classLike, value: '^WPFasty\\Data\\.*' }
          must_not:
            - { type: classLike, value: '^WPFasty\\Data\\ContextFactory$' }
    # Renderer: Latte/Twig engines, kit, view helpers
    - name: Renderer
      collectors:
        - { type: classLike, value: '^WPFasty\\Template\\.*' }
    - name: BuilderContract
      collectors:
        - { type: classLike, value: '^WPFastyBuilder\\AdminPalette$' }
    - name: AgentContract
      collectors:
        - { type: classLike, value: '^WPFastyBuilder\\(ChatTelemetry|AgentPolicyDefinition|WorkerProtocol)$' }
    - name: AgentAdapter
      collectors:
        - { type: classLike, value: '^WPFastyBuilder\\(Chat|AgentPolicy|AgentModule|WordPressInput)$' }
    # Adapter\WordPress: hooks, theme service, plugins wiring into WP
    - name: Adapter\WordPress
      collectors:
        - { type: classLike, value: '^WPFasty\\Hooks\\.*' }
        - { type: classLike, value: '^WPFasty\\Adapter\\WordPress\\.*' }
        # the facade/orchestrator: reads the WordPress request state and hands it to ports and builders
        - { type: classLike, value: '^WPFasty\\Data\\ContextFactory$' }
        - { type: classLike, value: '^WPFasty\\Types\\Registry$' }
        - { type: classLike, value: '^WPFasty\\Theme\\.*' }
        - type: bool
          must:
            - { type: classLike, value: '^WPFastyBuilder\\.*' }
          must_not:
            - { type: classLike, value: '^WPFastyBuilder\\(ChatTelemetry|AdminPalette|AgentPolicyDefinition|WorkerProtocol|Chat|AgentPolicy|AgentModule|WordPressInput)$' }
        - { type: classLike, value: '^WPFastyTypes\\.*' }
    # Templates: WordPress template-hierarchy entry files (index.php, single.php, functions.php, ...)
    - name: Templates
      collectors:
        - { type: directory, value: 'themes/wp-fasty/[^/]+\.php$' }
    # WordPress itself (php-stubs/wordpress-stubs: WP_Post, WP_Query, ...)
    - name: WordPress
      collectors:
        - { type: directory, value: 'vendor/php-stubs/wordpress-stubs/.*' }
  ruleset:
    BuilderContract: ~
    AgentContract: ~
    AgentAdapter: [AgentContract, Adapter\WordPress, BuilderContract, WordPress]
    Core: ~
    ViewModel: [Core]
    Renderer: [Core, WordPress]
    Adapter\WordPress: [Core, ViewModel, Renderer, WordPress, BuilderContract]
    Templates: [Core, ViewModel, Renderer, Adapter\WordPress, WordPress]
    WordPress: ~
