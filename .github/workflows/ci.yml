name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  WP_VERSION: "7.1.3"
  THEME_CHECK_VERSION: "20260901"

jobs:
  verify:
    # Static checks + build: audit, site manifests, codegen, design lint, CSS, PHPUnit, strict PHPCS, release zip.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer, wp-cli
          coverage: none

      - name: Cache bun + composer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/composer
          key: deps-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/composer.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Install root PHP tooling
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit (root)
        run: composer audit --no-interaction

      - name: Site manifests (schema v0.2, rules, parity with press/folio/shop)
        run: |
          bun install --frozen-lockfile
          bun run manifest:validate

      - name: Generator round-trip (byte-identical) + slug retarget test (namespace, text domain)
        run: |
          bun run theme:roundtrip
          bun run generate:test

      - name: Configurator self-test + static form up to date
        run: |
          bun run configure:test
          bun run configure:form
          git diff --exit-code -- configurator

      - name: Codegen verify (Latte + Twig primitives)
        run: |
          bun install --cwd packages/ui8kit-codegen
          bun run codegen:verify

      - name: Generate UI8Kit Latte primitives
        run: |
          bun run ui:primitives
          bun run ui:install

      - name: Composer audit (theme)
        run: composer audit --no-interaction --working-dir=themes/latte

      - name: Build theme views from presets
        run: bun run theme:build -- latte

      - name: Design lint (tokens, 8px grid, no half-steps / arbitrary px)
        run: bun run lint:design

      - name: CSS build (Tailwind v4, token-only) — committed CSS must be up to date
        run: |
          bun install --cwd .workspaces/css-build
          bun run css:build
          git diff --exit-code -- themes/latte/assets/css

      - name: Builder editor (Svelte 5, Vite IIFE) — svelte-check, build, committed assets must match
        run: |
          bun install --cwd plugins/wpfasty-builder/editor --frozen-lockfile
          bun run --cwd plugins/wpfasty-builder/editor check
          bun run --cwd plugins/wpfasty-builder/editor build
          git diff --exit-code -- plugins/wpfasty-builder/assets

      - name: PHPUnit (themes, types, builder compiler/links)
        run: composer test

      - name: Latte ↔ Twig parity (all suites, fixture contexts and full pages, normalized HTML)
        run: bun run parity

      - name: PHPCS (errors and warnings fail the build; themes + wpfasty-types + wpfasty-builder)
        run: composer phpcs

      - name: Pack parent zips (isolated engines — latte.zip ships only Latte, twig.zip only Twig)
        run: |
          bun run theme:pack -- latte
          bun run theme:pack -- latte --engine twig
          L=$(unzip -Z1 dist/latte.zip); T=$(unzip -Z1 dist/twig.zip)
          echo "$L" | grep -q '^latte/vendor/latte/latte/'
          echo "$T" | grep -q '^twig/vendor/twig/twig/LICENSE'
          ! echo "$L" | grep -iE 'vendor/twig|\.html\.twig$|TwigRenderer|ui8kit-twig'
          ! echo "$T" | grep -iE 'vendor/latte|\.latte$|LatteRenderer|LatteEngine|ui8kit-latte|latte-primitives'
          unzip -p dist/twig.zip twig/style.css | grep -q '^Text Domain: twig'
          unzip -p dist/twig.zip twig/classes/Template/Engines.php | grep -q "BUILT = \['twig'\]"
          unzip -p dist/latte.zip latte/classes/Template/Engines.php | grep -q "BUILT = \['latte'\]"

      - name: MCP server smoke (stdio; all five tools, writes only to dist/)
        run: bun run mcp:smoke

      - name: Package site examples (theme:package → dist/<slug>/ zips + Playground bundle)
        run: |
          for t in press folio shop; do bun run theme:package "manifests/examples/$t.json"; done
          # Configurator fixtures: answers → manifest (validated) → package.
          for a in manifests/answers/*.json; do bun run theme:new-site --answers "$a" --package; done
          # Engine matrix: every fixture in the other engine + Twig twin manifests of the example sites.
          for a in $(bun tools/matrix/engine-variants.ts); do
            case "$a" in */manifest-*) bun run theme:package "$a" ;; *) bun run theme:new-site --answers "$a" --package ;; esac
          done
          ls -d dist/*/ | grep -v -e generated -e manifests -e answers-matrix | xargs -n1 basename > dist/sites.txt
          # Every site ships only its engine: the parent of that engine, its views, its builder runtime.
          for s in $(cat dist/sites.txt); do
            e=$(bun -e "console.log(require('./dist/$s/site.manifest.json').engine ?? 'latte')"); o=$([ "$e" = twig ] && echo latte || echo twig)
            test -f "dist/$s/$e.zip"; test ! -f "dist/$s/$o.zip"
            unzip -p "dist/$s/$s.zip" "$s/style.css" | grep -q "^Template: $e\$"
            ! unzip -Z1 "dist/$s/$s.zip" | grep -E "$([ "$e" = twig ] && echo '\.latte$' || echo '\.html\.twig$')"
            [ ! -f "dist/$s/wpfasty-builder.zip" ] || ! unzip -Z1 "dist/$s/wpfasty-builder.zip" | grep -q "sources/ui8kit/$o/"
          done
          { echo "### Packages"; echo "| file | bytes |"; echo "|---|---|"
            for f in dist/latte.zip dist/twig.zip $(sed 's#^#dist/#; s#$#/*#' dist/sites.txt); do echo "| \`$f\` | $(stat -c %s "$f") |"; done; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/latte.zip
            dist/twig.zip
            dist/sites.txt
            dist/*/*.zip
            dist/*/*.json
            !dist/generated
          retention-days: 7

  wordpress:
    # Integration on a real WordPress + MariaDB: Theme Check (0 REQUIRED) and the N+1 query guard.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install @ui8kit/contract (layout validator)
        run: bun install --frozen-lockfile

      - name: Setup PHP + WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: wp-cli
          extensions: mysqli, gd
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cache WordPress core + Theme Check
        uses: actions/cache@v4
        with:
          path: /tmp/wp-dl
          key: wp-${{ env.WP_VERSION }}-tc-${{ env.THEME_CHECK_VERSION }}

      - name: Install WordPress, themes and plugins
        run: |
          mkdir -p /tmp/wp-dl /tmp/wp
          [ -f /tmp/wp-dl/wp.tar.gz ] || curl -sSfLo /tmp/wp-dl/wp.tar.gz "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz"
          [ -f /tmp/wp-dl/tc.zip ] || curl -sSfLo /tmp/wp-dl/tc.zip "https://downloads.wordpress.org/plugin/theme-check.${THEME_CHECK_VERSION}.zip"
          tar -xzf /tmp/wp-dl/wp.tar.gz -C /tmp/wp --strip-components=1
          cd /tmp/wp
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_DISPLAY true --raw
          wp config set WP_DEBUG_LOG "'/tmp/wp-debug.log'" --raw
          # No wordpress.org update/API calls: an outage there must not trip the PHP-notice gate.
          mkdir -p wp-content/mu-plugins && cp "$GITHUB_WORKSPACE/tools/qa/offline.php" wp-content/mu-plugins/
          wp core install --url=http://localhost --title=CI --admin_user=admin --admin_password=admin \
            --admin_email=ci@example.com --skip-email
          # Everything under test comes from the theme:package zips (dist artifact), not from repo folders. Both parents
          # are installed side by side (latte, twig): every site runs on its own engine's parent (ADR-001, K7).
          D="$GITHUB_WORKSPACE/dist"
          unzip -q "$D/latte.zip" -d wp-content/themes/
          unzip -q "$D/twig.zip" -d wp-content/themes/
          for s in $(cat "$D/sites.txt"); do unzip -q "$D/$s/$s.zip" -d wp-content/themes/; done
          for t in latte-press latte-folio latte-shop; do mkdir -p "/tmp/demo-$t" && unzip -q "$D/$t/demo.zip" -d "/tmp/demo-$t"; done
          unzip -q "$D/latte-shop/wpfasty-types.zip" -d wp-content/plugins/
          # The builder plugin build of the site engine; steps swap it with tools/qa/use-builder (latte|twig).
          mkdir -p /tmp/builder && cp "$D/latte-shop/wpfasty-builder.zip" /tmp/builder/latte.zip && cp "$D/latte-shop-twig/wpfasty-builder.zip" /tmp/builder/twig.zip
          printf '#!/bin/sh\nrm -rf /tmp/wp/wp-content/plugins/wpfasty-builder && unzip -q "/tmp/builder/$1.zip" -d /tmp/wp/wp-content/plugins/\n' | sudo tee /usr/local/bin/use-builder > /dev/null
          sudo chmod +x /usr/local/bin/use-builder && use-builder latte
          # latte-skin has no site manifest yet: still from the repo.
          rsync -a --exclude '~cache' "$GITHUB_WORKSPACE/themes/latte-skin" wp-content/themes/
          unzip -q /tmp/wp-dl/tc.zip -d wp-content/plugins/
          wp plugin activate wpfasty-types wpfasty-builder theme-check
          wp rewrite structure '/%postname%/' --hard
          wp theme list --fields=name,version,status

      - name: Theme Check — no REQUIRED issues (latte.zip, twig.zip, every packaged site, latte-skin from repo)
        run: |
          cd /tmp/wp
          fail=0
          for t in latte twig latte-skin $(cat "$GITHUB_WORKSPACE/dist/sites.txt"); do
            code=0
            PAGER=cat wp theme-check run "$t" > "/tmp/tc-$t.txt" 2>&1 || code=$?
            r=$(grep -c '^REQUIRED' "/tmp/tc-$t.txt" || true)
            w=$(grep -c '^WARNING' "/tmp/tc-$t.txt" || true)
            rec=$(grep -c '^RECOMMENDED' "/tmp/tc-$t.txt" || true)
            echo "::group::$t — exit $code, REQUIRED $r, WARNING $w, RECOMMENDED $rec"
            cat "/tmp/tc-$t.txt"
            echo "::endgroup::"
            echo "| $t | $r | $w | $rec |" >> /tmp/tc-summary.md
            if [ "$r" -ne 0 ] || [ "$code" -ne 0 ]; then
              echo "::error::Theme Check $t: REQUIRED=$r exit=$code"
              fail=1
            fi
          done
          { echo "### Theme Check ${THEME_CHECK_VERSION} (WP ${WP_VERSION})"; echo "| theme | REQUIRED | WARNING | RECOMMENDED |"; echo "|---|---|---|---|"; cat /tmp/tc-summary.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: N+1 guard under both engines — Latte sites and their Twig twins (2 vs 6 items)
        run: |
          cd /tmp/wp
          echo "### N+1 guard (queries for 2 vs 6 items)" >> "$GITHUB_STEP_SUMMARY"
          echo "| theme | type | 2 items | 6 items | list only (no widgets) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          guard() { # theme post_type
            wp theme activate "$1" --quiet
            wp eval-file "$GITHUB_WORKSPACE/tools/perf/seed.php" "$2" 7
            out=$(wp eval-file "$GITHUB_WORKSPACE/tools/perf/queries.php" "$2" 2 6 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            # A comparison that could not run (too few posts) is a failure in CI, not a pass.
            if echo "$out" | grep -q '^Warning:'; then echo "::error::N+1 guard for $1 $2 did not compare"; exit 1; fi
            echo "$out" | head -1 | sed -E 's/^[a-z_]+: [0-9]+ posts → ([0-9]+) queries; [0-9]+ posts → ([0-9]+) queries \(list only, no widgets: ([0-9]+) → ([0-9]+)\)$/| '"$1"' | '"$2"' | \1 | \2 | \3 → \4 |/' >> "$GITHUB_STEP_SUMMARY"
          }
          use-builder latte
          guard latte-press post
          guard latte-folio project
          guard latte-shop product
          use-builder twig
          guard latte-press-twig post
          guard latte-folio-twig project
          guard latte-shop-twig product
          use-builder latte

      - name: Builder — seed landings, smoke-render (200, no PHP notices), validate layouts with @ui8kit/contract
        run: |
          cd /tmp/wp
          wp option update home http://127.0.0.1:8080 --quiet
          wp option update siteurl http://127.0.0.1:8080 --quiet
          # Single process: php 8.3 -S with PHP_CLI_SERVER_WORKERS segfaulted intermittently on the runner (core dump,
          # no PHP error). Page renders need no loopback; wp-cron's non-blocking spawn just times out. Supervised anyway.
          nohup bash -c 'while true; do php -S 127.0.0.1:8080 -t /tmp/wp >> /tmp/php-server.log 2>&1; echo "php -S exited ($?), restarting" >> /tmp/php-server.log; sleep 1; done' > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/wp-login.php && break; sleep 1; done
          mkdir -p /tmp/layouts
          php "$GITHUB_WORKSPACE/tools/builder/layout-manifest.php" > /tmp/layout-manifest.json
          echo "### Builder landings" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for site in press folio shop; do
            wp theme activate "latte-$site" --quiet
            # Landings from the packaged demo.zip, in manifest order (front page first).
            for f in $(bun -e "for (const l of require('$GITHUB_WORKSPACE/manifests/examples/$site.json').builder.landings) console.log('/tmp/demo-latte-$site/wpfasty-demo/landings/' + l.file.split('/').pop())"); do
              out=$(wp eval-file "$GITHUB_WORKSPACE/tools/builder/seed-landing.php" "$f" 2>&1) || { echo "$out"; exit 1; }
              echo "$out"
              id=$(echo "$out" | sed -n 's/^Success: Page \([0-9]*\) .*/\1/p')
              url=$(wp eval "echo get_permalink($id);")
              echo "${url#http://127.0.0.1:8080}" >> "/tmp/landings-$site.txt"
              code=$(curl -s --retry 5 --retry-delay 2 --retry-all-errors -o /tmp/landing.html -w '%{http_code}' "$url" || true)
              notices=$(grep -cE '<b>(Warning|Notice|Deprecated|Fatal error)</b>' /tmp/landing.html || true)
              blocks=$(grep -c 'wpfb-page' /tmp/landing.html || true)
              wp post meta get "$id" _wpfb_layout > "/tmp/layouts/$site-$(basename "$f")"
              echo "- latte-$site \`$(basename "$f")\` → $url: HTTP $code, notices $notices" | tee -a "$GITHUB_STEP_SUMMARY"
              if [ "$code" != 200 ] || [ "$notices" -ne 0 ] || [ "$blocks" -eq 0 ]; then
                echo "::error::landing $(basename "$f") on latte-$site: HTTP $code, notices $notices, builder markup $blocks"
                fail=1
              fi
            done
          done
          # One collection per site (the home landing of each site reuses the same page, key and slug).
          for site in press folio shop; do
            if ! (cd "$GITHUB_WORKSPACE" && bun tools/builder/validate-layouts.ts --manifest /tmp/layout-manifest.json \
                /tmp/layouts/$site-*.json) > "/tmp/validate-$site.txt" 2>&1; then
              echo "::error::@ui8kit/contract validation failed for latte-$site landings"
              fail=1
            fi
            cat "/tmp/validate-$site.txt"
            echo "- latte-$site contract: $(tail -1 "/tmp/validate-$site.txt")" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $fail

      - name: Isolated engines — every site on its own parent (only its engine loaded), parity of Latte ↔ Twig twins incl. builder landings
        run: |
          cd /tmp/wp
          D="$GITHUB_WORKSPACE/dist"; Q="$GITHUB_WORKSPACE/tools/qa/site-pair.sh"; B=http://127.0.0.1:8080
          mkdir -p wp-content/mu-plugins && cp "$GITHUB_WORKSPACE/tools/qa/engine-marker.php" wp-content/mu-plugins/
          url() { wp theme activate "$1" --quiet; wp post list --post_type="$2" --posts_per_page=1 --field=url | sed "s#^$B##"; }
          P=$(url latte-press post); F=$(url latte-folio project); S=$(url latte-shop product)
          paths() { # site → paths
            case "$1" in
              latte-press|latte-press-twig) echo "$P /?s=post /no-such-page/|404 /subscribe/ $(cat /tmp/landings-press.txt)" ;;
              latte-folio|latte-folio-twig) echo "$F /work/ /no-such-page/|404 /services/ $(cat /tmp/landings-folio.txt)" ;;
              latte-shop|latte-shop-twig) echo "$S /shop/ /cart/ /checkout/ /no-such-page/|404 /sale/ $(cat /tmp/landings-shop.txt)" ;;
              *) echo "/ /?s=a /no-such-page/|404" ;;
            esac
          }
          engine() { bun -e "console.log(require('$D/$1/site.manifest.json').engine ?? 'latte')"; }
          fail=0
          for e in latte twig; do
            use-builder "$e"
            for s in $(cat "$D/sites.txt"); do
              [ "$(engine "$s")" = "$e" ] || continue
              echo "::group::$s ($e)"; bash "$Q" fetch . "$B" "$s" "/tmp/pair/$s" $(paths "$s") || fail=1; echo "::endgroup::"
            done
          done
          use-builder latte
          # Parity (quality check): every site against its twin in the other engine, Latte side first.
          n=0
          for s in $(cat "$D/sites.txt"); do
            [ "$(engine "$s")" = latte ] || continue
            for t in "$s-twig" "${s%-latte}"; do
              [ "$t" != "$s" ] && grep -qx "$t" "$D/sites.txt" && [ "$(engine "$t")" = twig ] || continue
              echo "::group::parity $s ↔ $t"; bash "$Q" compare "/tmp/pair/$s" "$s" "/tmp/pair/$t" "$t" || fail=1; echo "::endgroup::"
              n=$((n + 1))
            done
          done
          echo "- Isolated engines: $(wc -l < "$D/sites.txt") sites, each on its own parent with only its engine loaded; $n Latte ↔ Twig pairs DOM-identical: $([ $fail -eq 0 ] && echo ok || echo FAIL)" >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: No PHP notices / warnings / deprecations logged
        if: always()
        run: |
          [ ! -s /tmp/php-server.log ] || { echo "::group::php -S log"; tail -50 /tmp/php-server.log; echo "::endgroup::"; }
          if [ -s /tmp/wp-debug.log ]; then
            echo "::error::PHP messages were logged during the WordPress job"
            sort /tmp/wp-debug.log | uniq -c | sort -rn | head -50
            exit 1
          fi
          echo "debug.log empty"
