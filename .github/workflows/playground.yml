name: Playground

# Rebuild the WordPress Playground preview zips (tools/playground-build.sh, the same script as locally) and publish
# them as assets of the rolling GitHub release `playground` (tools/playground-release.sh; the gist hit its size quota on
# 2026-11-03 and its push failure was hidden by `| tee`). Only zips whose content changed are replaced; the step fails
# when an upload fails or an asset does not come back identical through the Playground CORS proxy. Manual run: `gh workflow run playground.yml --repo alexy-os/wp-fasty` (or Actions → Playground → Run).

on:
  workflow_dispatch:
  # ModulY zips come from phpfasty/wpmodules release assets (edge); pick up new builds without a cross-repo token.
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - "themes/**"
      - "plugins/wpfasty-types/**"
      - "plugins/wpfasty-builder/**"
      - "tools/demo/**"
      - "tools/builder/landings/**"
      - "tools/matrix/**"
      - "tools/playground-build.sh"
      - "tools/playground-publish.sh"
      - "playground/*.json"
      - "playground/shop/**"
      - "tools/playground-release.sh"
      - "presets/**"
      - "manifests/examples/**"
      - ".workspaces/theme-builder/**"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/playground.yml"

# one publish at a time; a newer push waits for the running one instead of racing it on the release assets
concurrency:
  group: playground-release
  cancel-in-progress: false

permissions:
  contents: write  # release assets of the rolling `playground` release

jobs:
  publish:
    if: github.repository == 'alexy-os/wp-fasty'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer, wp-cli
          coverage: none

      - name: Install
        run: |
          sudo apt-get install -y -qq zip >/dev/null
          composer install --no-interaction --prefer-dist --no-progress
          bun install --frozen-lockfile

      - name: Build the ten zips (tools/playground-build.sh)
        run: bash tools/playground-build.sh

      - name: Publish changed zips to the rolling release `playground`, check every asset via the CORS proxy (200 + content)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash tools/playground-release.sh --push | tee "$RUNNER_TEMP/publish.txt"
          { echo "### Playground release assets"; echo '```'; cat "$RUNNER_TEMP/publish.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
