# PROPOSED replacement for .github/workflows/ci.yml — could not be pushed: the push token lacks the GitHub `workflow` scope.
# Apply: cp docs/agent/ci.proposed.yml .github/workflows/ci.yml (with a token/user that has `workflow` scope).
# Not executed on GitHub yet; individual commands were run locally (see tooling.md).
name: CI

on:
  push:
    branches: [main, improved, "cursor/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Install root PHP tooling
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit (root)
        run: composer audit --no-interaction

      - name: Codegen verify (Latte + Twig primitives)
        run: |
          bun install --cwd packages/ui8kit-codegen
          bun run codegen:verify

      - name: Generate UI8Kit Latte primitives
        run: |
          bun run ui:primitives
          bun run ui:install

      - name: Composer audit (theme)
        run: composer audit --no-interaction --working-dir=themes/latte

      - name: Build theme views from presets
        run: bun run theme:build -- latte

      - name: Design lint (tokens, 8/4 spacing, no raw children)
        run: bun run lint:design

      - name: CSS build (Tailwind v4, token-only)
        run: |
          bun install --cwd .workspaces/css-build
          bun run css:build

      - name: PHPUnit
        run: composer test

      - name: PHPCS
        run: composer phpcs

      - name: Pack theme zip
        run: bun run theme:pack -- latte

  wordpress:
    # Integration: real WordPress + MySQL — Theme Check (0 REQUIRED) and N+1 query guard.
    needs: verify
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer, wp-cli
          extensions: mysqli
          coverage: none

      - name: Build parent theme
        run: |
          bun install --cwd packages/ui8kit-codegen
          bun run ui:primitives
          bun run ui:install
          bun run theme:build -- latte

      - name: Install WordPress
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --quiet
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --url=http://localhost --title=CI --admin_user=admin --admin_password=admin --admin_email=ci@example.com --skip-email
          for t in latte latte-press latte-folio latte-shop; do ln -s "$GITHUB_WORKSPACE/themes/$t" wp-content/themes/$t; done
          ln -s "$GITHUB_WORKSPACE/plugins/wpfasty-types" wp-content/plugins/wpfasty-types
          wp plugin activate wpfasty-types
          curl -sSLo /tmp/tc.zip https://downloads.wordpress.org/plugin/theme-check.latest-stable.zip
          wp plugin install /tmp/tc.zip --activate

      - name: Theme Check — no REQUIRED issues
        run: |
          cd /tmp/wp
          rm -rf "$GITHUB_WORKSPACE/themes/latte/~cache"
          fail=0
          for t in latte latte-press latte-folio latte-shop; do
            PAGER=cat wp theme-check run $t > /tmp/tc-$t.txt 2>&1 || true
            n=$(grep -c REQUIRED /tmp/tc-$t.txt || true)
            echo "$t: REQUIRED=$n"; grep REQUIRED /tmp/tc-$t.txt || true
            [ "$n" -eq 0 ] || fail=1
          done
          exit $fail

      - name: N+1 guard (SAVEQUERIES)
        run: |
          cd /tmp/wp
          wp theme activate latte-press
          for i in 1 2 3 4 5 6 7; do wp post create --post_title="Post $i" --post_status=publish --quiet; done
          wp eval-file "$GITHUB_WORKSPACE/tools/perf/queries.php" post 2 6
